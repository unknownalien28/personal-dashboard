<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AlienOS logo">
  <defs>
    <linearGradient id="alienos-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2563EB" />
      <stop offset="1" stop-color="#7C3AED" />
    </linearGradient>
    <radialGradient id="alienos-node-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#06B6D4" stop-opacity="0.9" />
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="64" height="64" rx="16" fill="url(#alienos-bg)" />

  <!-- Orbit ring, drawn behind the "A" mark -->
  <ellipse
    cx="32" cy="34" rx="21" ry="10"
    transform="rotate(-24 32 34)"
    fill="none"
    stroke="#FFFFFF"
    stroke-opacity="0.35"
    stroke-width="1.6"
  />

  <!-- Stylized geometric "A": solid triangle with an evenodd cutout for the crossbar gap -->
  <path
    fill-rule="evenodd"
    clip-rule="evenodd"
    d="M32 13 L48 46 L16 46 Z M32 25.5 L40 42 L24 42 Z"
    fill="#FFFFFF"
  />

  <!-- Glowing node sitting on the orbit ring -->
  <circle cx="51" cy="27" r="5.5" fill="url(#alienos-node-glow)" />
  <circle cx="51" cy="27" r="2.4" fill="#06B6D4" />
</svg>
