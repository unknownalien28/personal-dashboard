<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AlienOS logo">
  <defs>
    <linearGradient id="alienos-bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2563EB" />
      <stop offset="1" stop-color="#7C3AED" />
    </linearGradient>
    <radialGradient id="alienos-node-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#06B6D4" stop-opacity="0.9" />
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#alienos-bg)" />

  <!-- Content scaled ~68% and centered to sit safely within the maskable safe-zone circle -->
  <g transform="translate(256 256) scale(0.68) translate(-256 -256)">
    <ellipse
      cx="256" cy="272" rx="168" ry="80"
      transform="rotate(-24 256 272)"
      fill="none"
      stroke="#FFFFFF"
      stroke-opacity="0.35"
      stroke-width="13"
    />
    <path
      fill-rule="evenodd"
      clip-rule="evenodd"
      d="M256 104 L384 368 L128 368 Z M256 204 L320 336 L192 336 Z"
      fill="#FFFFFF"
    />
    <circle cx="408" cy="216" r="44" fill="url(#alienos-node-glow)" />
    <circle cx="408" cy="216" r="19" fill="#06B6D4" />
  </g>
</svg>
